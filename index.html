<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="App da Igreja Foi Por Amor — programação, oração, devocional e muito mais." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IFPA" />
    <title>Igreja Foi Por Amor</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0d0d0d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash-logo {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        animation: splashPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        opacity: 0;
        box-shadow: 0 0 0 0 rgba(255,255,255,0.15);
      }
      #splash-title {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.5px;
        animation: splashFadeUp 0.6s ease 0.4s forwards;
        opacity: 0;
        text-align: center;
      }
      #splash-sub {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.8rem;
        color: rgba(255,255,255,0.45);
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: splashFadeUp 0.6s ease 0.6s forwards;
        opacity: 0;
        text-align: center;
      }
      #splash-dots {
        display: flex;
        gap: 6px;
        animation: splashFadeUp 0.5s ease 0.9s forwards;
        opacity: 0;
      }
      #splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.3);
        animation: splashBounce 1s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.30s; }

      @keyframes splashPop {
        0%   { opacity: 0; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splashFadeUp {
        0%   { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashBounce {
        0%, 100% { transform: translateY(0);    opacity: 0.3; }
        50%       { transform: translateY(-5px); opacity: 1;   }
      }
    </style>
  </head>
  <body>
    <script>window._splashStart = Date.now();</script>
    <!-- Splash screen — removido pelo main.jsx após React montar -->
    <div id="splash">
      <img id="splash-logo" src="/logo.jpeg" alt="Igreja Foi Por Amor" />
      <p id="splash-title">Igreja Foi Por Amor</p>
      <p id="splash-sub">Evangélica</p>
      <div id="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
